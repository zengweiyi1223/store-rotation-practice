function expiryTable(group){
  const rows=group.filter(x=>x.id>=6&&x.id<=13).map(x=>{let parts=x.text.match(/^(.*?)，(.*?)，(提前.*?下架。)$/);if(!parts)return `<tr><td colspan="3">${esc(x.text)}</td></tr>`;return `<tr><td>${esc(parts[1])}</td><td>${esc(parts[2])}</td><td>${esc(parts[3])}</td></tr>`}).join('');
  const note=group.find(x=>x.id===14);
  return `<table class="expiry-table"><thead><tr><th>商品类型</th><th>保质期区间</th><th>提前下架</th></tr></thead><tbody>${rows}</tbody></table>${note?`<div class="expiry-note">${esc(note.text)}</div>`:''}<small>${sourceText(PDF_SOURCES.required,[1])}</small>`;
}
function readingTable(caption, rows, columns, highlightedLabels=[]){
  const header = columns ? `<thead><tr><th scope="col">${esc(columns[0])}</th><th scope="col">${esc(columns[1])}</th></tr></thead>` : '';
  const body = rows.map(([label, text]) => `<tr><th scope="row"${highlightedLabels.includes(label) ? ' class="shared-category"' : ''}>${esc(label)}</th><td>${lines(text)}</td></tr>`).join('');
  return `<table class="knowledge-table"><caption>${esc(caption)}</caption><colgroup><col style="width:24%"><col></colgroup>${header}<tbody>${body}</tbody></table>`;
}
function classificationTables(group){
  const sections = [
    ['（一）常温定量商品', [24, 25]],
    ['（二）散称商品', [26, 27]],
    ['（三）冷冻冷藏', [28]],
    ['（四）非休闲商品', [29]]
  ];
  const content = sections.map(([title, ids]) => {
    const rows = [];
    for (const card of group.filter(c => ids.includes(c.id))){
      for (const line of card.text.split('\n')){
        const separator = line.indexOf('：');
        if (separator < 0) continue;
        rows.push([line.slice(0, separator), line.slice(separator + 1)]);
      }
    }
    const commonOrder = ['糖巧', '果冻', '蜜饯果干', '坚果炒货', '冲调', '膨化休闲', '饼干糕点'];
    const order = ids.includes(24) ? commonOrder
      : ids.includes(26) ? commonOrder.map(label => label === '冲调' ? '固体冲调' : label) : [];
    if (order.length){
      rows.sort((a,b) => {
        const first = order.indexOf(a[0]), second = order.indexOf(b[0]);
        return (first < 0 ? order.length : first) - (second < 0 ? order.length : second);
      });
    }
    return readingTable(title, rows, ['分类', '商品明细'], order);
  }).join('');
  return '<p class="comparison-note">淡红底表示定量与散称中同名或对应的分类。</p>' + content;
}
function equipmentTables(group){
  const devices = new Map();
  const fields = new Set(['制作配比', '售卖时长', '清洗周期', '陈列商品', '操作设备', '制作流程', '陈列规范', '储存时长', '储放时长', '微波炉加热时长']);
  for (const card of group){
    const [heading, ...body] = card.text.split('\n');
    const name = heading.split('（')[0];
    if (!devices.has(name)) devices.set(name, {title:heading, rows:new Map()});
    const device = devices.get(name);
    if (heading.includes('（')) device.title = heading;
    let field = '';
    for (const line of body){
      const separator = line.indexOf('：');
      const label = separator < 0 ? '' : line.slice(0, separator);
      let value = line;
      if (fields.has(label)){
        field = label;
        value = line.slice(separator + 1);
      } else if (label === '清洗步骤'){
        field = '清洗周期';
      } else if (label === '单盘烤制'){
        field = '制作流程';
      }
      if (!field) continue;
      if (!device.rows.has(field)) device.rows.set(field, []);
      if (value) device.rows.get(field).push(value);
    }
  }
  return [...devices.values()].map(device => readingTable(
    device.title,
    [...device.rows].map(([label, parts]) => [label, parts.join('\n')])
  )).join('');
}
function displayNotes(group){
  const card = id => group.find(item => item.id === id);
  const withoutNumber = text => text.replace(/^\d+\.\s*/, '');
  const golden = card(30).text.split('\n').slice(1);
  const definition = golden[0].slice(golden[0].indexOf('：')+1);
  const arrangement = [
    golden.slice(1).join('\n'),
    '端架：' + withoutNumber(card(32).text).slice('端架'.length),
    '地堆：' + withoutNumber(card(33).text).slice('地堆'.length)
  ].join('\n');
  const positioning = readingTable('黄金位置', [
    ['是什么', definition],
    ['放什么', withoutNumber(card(31).text)],
    ['怎么放', arrangement]
  ]);

  const steps = card(34).text.split('\n').slice(1).join('\n').split('；');
  const pairs = [0,2,4].map(index => `<tr>${steps.slice(index,index+2).map(step => `<td><strong>${esc(step.slice(0,2))}</strong>${esc(step.slice(2))}</td>`).join('')}</tr>`).join('');
  const process = `<table class="knowledge-table display-steps"><caption>六部法（散称商品）</caption><colgroup><col style="width:50%"><col></colgroup><tbody>${pairs}</tbody></table>`;

  function rules(first, last){
    return group.filter(item => item.id >= first && item.id <= last).map(item => {
      const text = item.text.split('\n').slice(-1)[0];
      const separator = text.indexOf('：');
      return [text.slice(0,separator), text.slice(separator+1)];
    });
  }
  const fruit = card(100).text.split('：');
  const supplement = `<p class="display-supplement"><strong>补充 · ${esc(fruit[0])}：</strong>${lines(fruit.slice(1).join('：'))}</p>`;
  return '<div class="display-tables">' + positioning + process
    + readingTable('散称陈列口诀', rules(35,42)) + supplement
    + readingTable('定量陈列口诀', rules(43,49)) + '</div>';
}

      content = group.map(c => {
        const titleText = c.title.replace(/\s+/g, '').replace(/…$/, '');
        const bodyText = c.text.replace(/\s+/g, '');
        const repeatsBody = bodyText === titleText || (c.title.endsWith('…') && bodyText.startsWith(titleText));
        const title = group.length === 1 || c.title === name || repeatsBody ? '' : `<h4>${esc(c.title)}</h4>`;
        const text = name === '品牌简介' ? brandHighlights(c) : lines(c.text);
        const source = consolidatedSource ? '' : `<small>${sourceText(c.id<=16?PDF_SOURCES.required:PDF_SOURCES.learning,[c.page])}</small>`;
        return `<article class="reading-point">${title}<p>${text}</p>${source}</article>`;
      }).join('');
    }
    section.insertAdjacentHTML('beforeend', content);
    if (consolidatedSource){
      const source = document.createElement('small');
      source.className = 'table-source';
      source.textContent = sourceText(PDF_SOURCES.learning, group.map(card => card.page));
      section.appendChild(source);
    }
    list.appendChild(section);
  }
}
function setupScopePicker(select){
  const dialog = $('scopeDialog');
  if (typeof dialog.showModal !== 'function') return;
  const trigger = $('scopeOpen');
  const choices = $('scopeChoices');
  for (const option of select.options){
    const row = document.createElement('label');
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'study-scope';
    radio.value = option.value;
    row.append(radio, document.createTextNode(option.text));
    choices.appendChild(row);
  }
  function updateLabel(){
    const text = select.options[select.selectedIndex].text;
    trigger.textContent = text;
    trigger.setAttribute('aria-label', '选择学习范围，当前：' + text);
  }
  updateLabel();
  select.addEventListener('change', updateLabel);
  trigger.onclick = () => {
    const current = choices.querySelectorAll('input')[select.selectedIndex];
    current.checked = true;
    dialog.showModal();
    current.focus();
  };
  choices.onclick = event => {
    if (event.target.tagName !== 'INPUT') return;
    const value = event.target.value;
    dialog.close();
    if (select.value === value) return;
    select.value = value;
    select.dispatchEvent(new Event('change', {bubbles:true}));
  };
  $('scopeClose').onclick = () => dialog.close();
  dialog.onclick = event => {
    if (event.target !== dialog) return;
    const box = dialog.getBoundingClientRect();
    if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) dialog.close();
  };
  dialog.hidden = false;
  trigger.hidden = false;
  select.parentElement.classList.add('scope-ready');
}
