,"百洁布","抹布","竹签","断电"]},{"id":53,"module":"鲜食区设备（效期、制作、清洗周期）","title":"蛋挞\n陈列商品：葡式蛋挞。\n售卖时长：12 小时。\n操…","text":"蛋挞\n陈列商品：葡式蛋挞。\n售卖时长：12 小时。\n操作设备：荣事达烤箱。\n单盘烤制：上下管250℃，功能上下管热风，预热15 分钟→取烤盘放置12 个挞皮并倒入挞液，挞液至挞皮口8 分满或至挞皮刻度线上，预热结束后，放入烤箱内第二层（由上向下）烤制第一轮15 分钟→时间到，打开烤箱进行水平换盘→第二轮烤制10 分钟，挞皮呈金黄色即可出炉放置保温柜。","page":3,"blanks":["250℃","15 分钟","12 个","10 分钟","分钟"]},{"id":54,"module":"鲜食区设备（效期、制作、清洗周期）","title":"蛋挞\n制作流程：\n双盘烤制：上下管250℃，功能上下管…","text":"蛋挞\n制作流程：\n双盘烤制：上下管250℃，功能上下管热风，预热15 分钟→取烤盘放置12 个挞皮并倒入挞液，挞液至挞皮口8 分满或至挞皮刻度线上，预热结束后，放入烤箱内第二层和第四层（由上至下）烤制第一轮20 分钟→时间到，进行上下换层，左右换面→第二轮烤制10 分钟。","page":3,"blanks":["15 分钟","12 个","20 分钟","10 分钟","分钟","制作流程"]},{"id":55,"module":"鲜食区设备（效期、制作、清洗周期）","title":"蛋挞\n陈列规范：挞皮金黄色、挞液焦糖色。\n6:00-2…","text":"蛋挞\n陈列规范：挞皮金黄色、挞液焦糖色。\n6:00-20:00，3 层前置陈列总量≥12（含烤箱内），制作出品达标。\n卖相不佳者需及时废弃，如掉皮、变形、破损、表面较干等。","page":3,"blanks":["陈列规范","变形","破损","表面较干","12"]},{"id":56,"module":"鲜食区设备（效期、制作、清洗周期）","title":"蛋挞\n清洗周期：日清洗（0 点至5 点）。\n设备毛巾（…","text":"蛋挞\n清洗周期：日清洗（0 点至5 点）。\n设备毛巾（内部）、环境毛巾（外部）。","page":3,"blanks":["0 点","5 点","清洗周期"]},{"id":57,"module":"鲜食区设备（效期、制作、清洗周期）","title":"蛋挞\n储存时长：冷冻开封蛋挞皮1 天；冷藏开封蛋挞液2…","text":"蛋挞\n储存时长：冷冻开封蛋挞皮1 天；冷藏开封蛋挞液2 天。","page":3,"blanks":["1 天","2 天","冷冻","冷藏","蛋挞"]},{"id":58,"module":"鲜食区设备（效期、制作、清洗周期）","title":"捞面机\n陈列商品：面类为乌冬面、车仔面、竹升面；酱料为…","text":"捞面机\n陈列商品：面类为乌冬面、车仔面、竹升面；酱料为XO 酱、香辣酱、葱油酱。","page":3,"blanks":["乌冬面","车仔面","竹升面","XO 酱"]},{"id":59,"module":"鲜食区设备（效期、制作、清洗周期）","title":"捞面机\n制作流程：煮面机加6L 过滤水→开火加热110…","text":"捞面机\n制作流程：煮面机加6L 过滤水→开火加热110℃后下面。\n乌冬面、车仔面：放入水中静置15 秒，再用筷子搅拌15 秒。","page":3,"blanks":["6L","110℃","15 秒"]},{"id":60,"module":"鲜食区设备（效期、制作、清洗周期）","title":"捞面机\n制作流程：\n竹升面：放水中静置30 秒，搅拌3…","text":"捞面机\n制作流程：\n竹升面：放水中静置30 秒，搅拌30 秒。\n煮好的面倒进拌面碗中，加入顾客需要的酱包，均匀搅拌。","page":3,"blanks":["30 秒","制作流程"]},{"id":61,"module":"鲜食区设备（效期、制作、清洗周期）","title":"捞面机\n陈列规范：胀包、漏气、异物不得陈列售卖。","text":"捞面机\n陈列规范：胀包、漏气、异物不得陈列售卖。","page":3,"blanks":["胀包","漏气","异物"]},{"id":62,"module":"鲜食区设备（效期、制作、清洗周期）","title":"茶叶蛋（保温温度75℃）\n制作配比：1 袋茶叶蛋粉：3…","text":"茶叶蛋（保温温度7 ":"贴墙、较高、层板连续。"},{"name":"定量中岛","image":"assets/location-2-168578510e.jpg","structure":"卖场中间的多层岛式货架。","feature":"可从两侧接近，通常为双面陈列。"},{"name":"散称中岛","image":"assets/location-3-7126d98efe.jpg","structure":"岛式开放容器或散称筐组合。","feature":"以开放筐格为主要结构。"},{"name":"挂区","structure":"按悬挂方式划分的陈列区域。","feature":"商品挂在挂钩或挂杆上，题干未指定货架位置。"},{"name":"端架","image":"assets/location-5-0d80855428.jpg","structure":"设在货架端头的展示架。","feature":"位于一排货架的尽头。"},{"name":"地堆","image":"assets/location-6-0f7a09e2c3.jpg","structure":"低位平台或托盘式堆放区域。","feature":"不依赖常规多层货架。"},{"name":"收银台二次销售区","image":"assets/location-7-3f03626d04.jpg","structure":"收银台附近的小型陈列区域。","feature":"紧邻结账位置。"},{"name":"挂区中岛货架","structure":"位于卖场通道中间的独立货架。","feature":"顾客可从两侧接近，商品主要通过挂钩悬挂。"},{"name":"冷饮柜","image":"assets/location-9-b124ae802e.jpg","structure":"带玻璃门的立式冷藏柜。","feature":"立式、玻璃门、冷藏展示。"},{"name":"风幕柜","structure":"前侧开放的冷藏展示设备。","feature":"顾客从开放面取货，冷气流帮助维持柜内温度。"},{"name":"冰柜","image":"assets/location-11-e41c17abe3.jpg","structure":"卧式冷冻展示柜。","feature":"低矮卧式、上方取放。"},{"name":"酒柜","structure":"专用酒类陈列柜或货架。","feature":"独立柜体或分层陈列结构。"},{"name":"烟柜","structure":"专用烟类陈列柜。","feature":"独立专用柜体，具体形式依门店而异。"}];window.openLocationImage=function(i,img){const w=window.open('','_blank');if(w){w.document.write('<meta name="viewport" content="width=device-width,initial-scale=1"><body style="margin:0;background:#101827;display:grid;place-items:center;min-height:100vh"><img style="width:100%;height:auto;max-width:1300px" src="'+LOCATION_CARDS[i].image+'"></body>');w.document.close()}else{img.classList.toggle('zoomed')}};function expiryTable(group){
  const rows=group.filter(x=>x.id>=6&&x.id<=13).map(x=>{let parts=x.text.match(/^(.*?)，(.*?)，(提前.*?下架。)$/);if(!parts)return `<tr><td colspan="3">${esc(x.text)}</td></tr>`;return `<tr><td>${esc(parts[1])}</td><td>${esc(parts[2])}</td><td>${esc(parts[3])}</td></tr>`}).join('');
  const note=group.find(x=>x.id===14);
  return `<table class="expiry-table"><thead><tr><th>商品类型</th><th>保质期区间</th><th>提前下架</th></tr></thead><tbody>${rows}</tbody></table>${note?`<div class="expiry-note">${esc(note.text)}</div>`:''}<small>商品效期 · PDF第1页</small>`;
}
function readingTable(caption, rows, pages, columns){
  const header = columns ? `<thead><tr><th scope="col">${esc(columns[0])}</th><th scope="col">${esc(columns[1])}</th></tr></thead>` : '';
  const body = rows.map(([label, text]) => `<tr><th scope="row">${esc(label)}</th><td>${lines(text)}</td></tr>`).join('');
  return `<table class="knowledge-table"><caption>${esc(caption)}</caption><colgroup><col style="width:24%"><col></colgroup>${header}<tbody>${body}</tbody></table><small class="table-source">PDF 第 ${pages.join('、')} 页</small>`;
}
function classificationTables(group){
  const sections = [
    ['（一）常温定量商品', [24]],
    ['酒水乳饮', [25]],
    ['（二）散称商品', [26, 27]],
    ['（三）冷冻冷藏', [28]],
    ['（四）非休闲商品', [29]]
  ];
  let content = sections.map(([title, ids]) => {
    const rows = [];
    const pages = new Set();
    for (const card of group.filter(c => ids.includes(c.id))){
      pages.add(card.page);
      for (const line of card.text.split('\n')){
        const separator = line.indexOf('：');
        if (separator < 0) continue;
        rows.push([line.slice(0, separator), line.slice(separator + 1)]);
      }
    }
    return readingTable(title, rows, [...pages], ['分类', '商品明细']);
  }).join('');
  const placement = group.filter(c => c.id >= 30 && c.id <= 33);
  content += `<div class="table-notes">${placement.map(c => `<p>${lines(c.text)}</p>`).join('')}<small>PDF 第 2 页</small></div>`;
  return content;
}
function equipmentTables(group){
  const devices = new Map();
  const fields = new Set(['制作配比', '售卖时长', '清洗周期', '陈列商品', '操作设备', '制作流程', '陈列规范', '储存时长', '储放时长', '微波炉加热时长']);
  for (const card of group){
    const [heading, ...body] = card.text.split('\n');
    const name = heading.split('（')[0];
    if (!devices.has(name)) devices.set(name, {title:heading, rows:new Map(), pages:new Set()});
    const device = devices.get(name);
    if (heading.includes('（')) device.title = heading;
    device.pages.add(card.page);
    let field = '';
    for (const line of body){
      const separator = line.indexOf('：');
      const label = separator < 0 ? '' : line.slice(0, separator);
      let value = line;
      if (fields.has(label)){
        field = label;
        value = line.slice(separator + 1);
      } else if (label === '清洗步骤'){
        field = '清洗周期';
      } else if (label === '单盘烤制'){
        field = '制作流程';
      }
      if (!field) continue;
      if (!device.rows.has(field)) device.rows.set(field, []);
      if (value) device.rows.get(field).push(value);
    }
  }
  return [...devices.values()].map(device => readingTable(
    device.title,
    [...device.rows].map(([label, parts]) => [label, parts.join('\n')]),
    [...device.pages]
  )).join('');
}
function renderLearn(){
  const groups = new Map();
  for (const card of filtered()){
    if (!groups.has(card.module)) groups.set(card.module, []);
    groups.get(card.module).push(card);
  }
  const list = $('learnList');
  list.textContent = '';
  $('learnCount').textContent = selected === 'ALL' ? `共 ${groups.size} 个学习范围`
    : selected === '商品库位名称' ? `共 ${LOCATION_CARDS.length} 种库位`
    : groups.get(selected).length === 1 || ['商品效期', '品牌发展重要阶段', '商品分类', '鲜食区设备（效期、制作、清洗周期）'].includes(selected) ? '' : `共 ${groups.get(selected).length} 条知识点`;
  for (const [name, group] of groups){
    const section = document.createElement('section');
    section.className = 'reading-group';
    const heading = document.createElement('h3');
    heading.textContent = name;
    section.appendChild(heading);
    let content;
    if (name === '商品库位名称'){
      content = '<p class="location-tip">8种库位配有可放大的参考图，另5种按文字特征识别。</p>'+LOCATION_CARDS.map((x,i)=>`<article class="location-card"><h4>${i+1}. ${esc(x.name)}</h4>${x.image ? `<img src="${x.image}" alt="${esc(x.name)}示意图" loading="lazy" class="location-photo" onclick="openLocationImage(${i},this)">` : ''}<div class="location-info"><p><b>结构：</b>${esc(x.structure)}</p><p><b>识别重点：</b>${esc(x.feature)}</p></div></article>`).join('')+'<small>商品库位名称 · 第二份PDF第1页；结构解释为辅助理解。</small>';
    } else if (name === '品牌发展重要阶段'){
      content = '<img class="brand-timeline-img" alt="品牌发展重要阶段时间轴：五个重要日期及对应事件" src="'+TIMELINE_IMAGE+'"><small>品牌发展重要阶段 · PDF第1页</small>';
    } else if (name === '商品效期'){
      content = expiryTable(group);
    } else if (name === '商品分类'){
      content = classificationTables(group);
    } else if (name === '鲜食区设备（效期、制作、清洗周期）'){
      content = equipmentTables(group);
    } else {
      content = group.map(c => {
        const titleText = c.title.replace(/\s+/g, '').replace(/…$/, '');
        const bodyText = c.text.replace(/\s+/g, '');
        const repeatsBody = bodyText === titleText || (c.title.endsWith('…') && bodyText.startsWith(titleText));
        const title = group.length === 1 || c.title === name || repeatsBody ? '' : `<h4>${esc(c.title)}</h4>`;
        const text = name === '品牌简介' ? brandHighlights(c) : lines(c.text);
        return `<article class="reading-point">${title}<p>${text}</p><small>PDF 第 ${c.page} 页</small></article>`;
      }).join('');
    }
    section.insertAdjacentHTML('beforeend', content);
    list.appendChild(section);
  }
}
function setupScopePicker(select){
  const dialog = $('scopeDialog');
  if (typeof dialog.showModal !== 'function') return;
  const trigger = $('scopeOpen');
  const choices = $('scopeChoices');
  for (const option of select.options){
    const row = document.createElement('label');
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'study-scope';
    radio.value = option.value;
    row.append(radio, document.createTextNode(option.text));
    choices.appendChild(row);
  }
  function updateLabel(){
    const text = select.options[select.selectedIndex].text;
    trigger.textContent = text;
    trigger.setAttribute('aria-label', '选择学习范围，当前：' + text);
  }
  updateLabel();
  select.addEventListener('change', updateLabel);
  trigger.onclick = () => {
    const current = choices.querySelectorAll('input')[select.selectedIndex];
    current.checked = true;
    dialog.showModal();
    current.focus();
  };
  choices.onclick = event => {
    if (event.target.tagName !== 'INPUT') return;
    const value = event.target.value;
    dialog.close();
    if (select.value === value) return;
    select.value = value;
    select.dispatchEvent(new Event('change', {bubbles:true}));
  };
  $('scopeClose').onclick = () => dialog.close();
  dialog.onclick = event => {
    if (event.target !== dialog) return;
    const box = dialog.getBoundingClientRect();
    if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) dialog.close();
  };
  dialog.hidden = false;
  trigger.hidden = false;
  select.parentElement.classList.add('scope-ready');
}
function init(){let s=$('module');selected=s.value;s.onchange=()=>{selected=s.value;document.querySelector('[data-mode=quiz]').textContent=selected==='商品库位名称'?'🧠 识图练习':'🧠 挖空练习';history=[];if(mode==='learn')renderLearn();else next()};setupScopePicker(s);document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('nextBtn').onclick=next;$('reset').onclick=()=>{if(confirm('确定清除所有学习记录吗？')){progress={};save();next()}};next()}init();
})();</script></body></html>
